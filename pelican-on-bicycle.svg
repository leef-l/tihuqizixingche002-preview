<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420"
     role="img" aria-labelledby="pelicanTitle pelicanDesc"
     stroke-linecap="round" stroke-linejoin="round">
  <title id="pelicanTitle">骑着自行车的鹈鹕</title>
  <desc id="pelicanDesc">一只白色鹈鹕骑着暖橙色自行车向前骑行，长喙与喉囊鲜明，翅膀扶着车把，蹼足踩在踏板上。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cae7fa"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcefc9"/>
      <stop offset="1" stop-color="#bcdaa2"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f79a5f"/>
      <stop offset="1" stop-color="#de5f2c"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <ellipse cx="310" cy="145" rx="58" ry="40" transform="rotate(-30 310 145)"/>
    </clipPath>

    <style>
      .wheel {
        animation: wheel-spin 1.5s linear infinite;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .crank-near {
        animation: pedal-near 1.5s ease-in-out infinite;
        transform-box: view-box;
        transform-origin: 320px 296px;
      }
      .crank-far {
        animation: pedal-far 1.5s ease-in-out infinite;
        transform-box: view-box;
        transform-origin: 320px 296px;
      }
      @keyframes wheel-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes pedal-near {
        0%, 100% { transform: rotate(-3deg); }
        50%      { transform: rotate(3deg); }
      }
      @keyframes pedal-far {
        0%, 100% { transform: rotate(3deg); }
        50%      { transform: rotate(-3deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wheel, .crank-near, .crank-far { animation: none; }
      }
    </style>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="640" height="420" fill="url(#skyGrad)"/>

  <!-- 云 -->
  <g fill="#ffffff">
    <g opacity="0.85">
      <ellipse cx="108" cy="84" rx="50" ry="25"/>
      <ellipse cx="76" cy="95" rx="32" ry="18"/>
      <ellipse cx="145" cy="95" rx="36" ry="20"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="526" cy="64" rx="42" ry="21"/>
      <ellipse cx="492" cy="75" rx="28" ry="15"/>
      <ellipse cx="558" cy="75" rx="30" ry="17"/>
    </g>
    <g opacity="0.5">
      <ellipse cx="286" cy="44" rx="34" ry="16"/>
      <ellipse cx="318" cy="51" rx="24" ry="12"/>
    </g>
  </g>

  <!-- 草地 -->
  <path d="M 0 372 C 110 360 210 382 330 372 C 450 362 550 380 640 368 L 640 420 L 0 420 Z"
        fill="url(#grassGrad)"/>

  <!-- 地面投影 -->
  <ellipse cx="170" cy="374" rx="78" ry="9" fill="#8fb473" opacity="0.45"/>
  <ellipse cx="466" cy="374" rx="78" ry="9" fill="#8fb473" opacity="0.45"/>

  <!-- 远侧腿与曲柄（车身之后） -->
  <g class="crank-far">
    <line x1="320" y1="296" x2="298" y2="264" stroke="#5d6a77" stroke-width="7"/>
    <path d="M 281 176 C 292 200 297 222 299 242" stroke="#d2862f" stroke-width="17" fill="none"/>
    <path d="M 300 238 C 299 246 298 251 297 255" stroke="#d2862f" stroke-width="13" fill="none"/>
    <rect x="286" y="257" width="24" height="10" rx="5" fill="#5d6a77" transform="rotate(-8 298 262)"/>
    <path d="M 287 249 Q 301 245 313 255 Q 303 264 291 261 Q 285 258 287 249 Z"
          fill="#d2862f" stroke="#bd7829" stroke-width="1.5"/>
  </g>

  <!-- 后轮 -->
  <g transform="translate(170,292)">
    <g class="wheel">
      <circle r="72" fill="none" stroke="#3b4753" stroke-width="11"/>
      <circle r="57" fill="none" stroke="#ccd8e2" stroke-width="7"/>
      <circle r="50" fill="none" stroke="#e9f1f6" stroke-width="1.5"/>
      <g stroke="#b3c0cb" stroke-width="2">
        <line x1="57" y1="0" x2="-57" y2="0"/>
        <line x1="49.4" y1="28.5" x2="-49.4" y2="-28.5"/>
        <line x1="28.5" y1="49.4" x2="-28.5" y2="-49.4"/>
        <line x1="0" y1="57" x2="0" y2="-57"/>
        <line x1="-28.5" y1="49.4" x2="28.5" y2="-49.4"/>
        <line x1="-49.4" y1="28.5" x2="49.4" y2="-28.5"/>
      </g>
      <circle r="9" fill="#93a0ab"/>
      <circle r="4" fill="#eaf1f6"/>
    </g>
  </g>

  <!-- 前轮 -->
  <g transform="translate(466,292)">
    <g class="wheel">
      <circle r="72" fill="none" stroke="#3b4753" stroke-width="11"/>
      <circle r="57" fill="none" stroke="#ccd8e2" stroke-width="7"/>
      <circle r="50" fill="none" stroke="#e9f1f6" stroke-width="1.5"/>
      <g stroke="#b3c0cb" stroke-width="2">
        <line x1="57" y1="0" x2="-57" y2="0"/>
        <line x1="49.4" y1="28.5" x2="-49.4" y2="-28.5"/>
        <line x1="28.5" y1="49.4" x2="-28.5" y2="-49.4"/>
        <line x1="0" y1="57" x2="0" y2="-57"/>
        <line x1="-28.5" y1="49.4" x2="28.5" y2="-49.4"/>
        <line x1="-49.4" y1="28.5" x2="49.4" y2="-28.5"/>
      </g>
      <circle r="9" fill="#93a0ab"/>
      <circle r="4" fill="#eaf1f6"/>
    </g>
  </g>

  <!-- 链条与飞轮 -->
  <g stroke="#8b98a4" stroke-width="3" stroke-dasharray="5 4" fill="none">
    <path d="M 320 273 L 170 281"/>
    <path d="M 320 319 L 170 303"/>
  </g>
  <circle cx="170" cy="292" r="11" fill="#c8d3dc" stroke="#9aa7b2" stroke-width="2"/>
  <circle cx="170" cy="292" r="4" fill="#eef3f7"/>

  <!-- 车架 -->
  <g stroke="url(#frameGrad)" stroke-width="9" fill="none">
    <path d="M 320 296 L 170 292"/>
    <path d="M 272 184 L 170 292"/>
    <path d="M 320 296 L 272 184"/>
    <path d="M 272 184 L 442 174"/>
    <path d="M 320 296 L 450 208"/>
  </g>
  <path d="M 442 174 L 450 208" stroke="url(#frameGrad)" stroke-width="11"/>
  <path d="M 450 208 C 452 240 457 268 466 292" stroke="url(#frameGrad)" stroke-width="8" fill="none"/>

  <!-- 车把 -->
  <path d="M 442 176 L 438 146 C 433 136 415 133 400 143"
        stroke="#4b5865" stroke-width="8" fill="none"/>
  <path d="M 414 136 C 406 136 400 139 397 144" stroke="#de5f2c" stroke-width="12" fill="none"/>

  <!-- 牙盘 -->
  <circle cx="320" cy="296" r="27" fill="none" stroke="#aebbc6" stroke-width="3" stroke-dasharray="3 4"/>
  <circle cx="320" cy="296" r="23" fill="#eef3f7" stroke="#c3ced7" stroke-width="2.5"/>
  <circle cx="320" cy="296" r="7" fill="#93a0ab"/>

  <!-- 鞍座 -->
  <path d="M 242 186 C 240 176 250 169 264 169 L 296 169 C 308 169 314 176 310 184
           C 306 191 294 194 278 194 L 256 194 C 246 194 243 191 242 186 Z" fill="#4b5865"/>

  <!-- 近侧腿、曲柄与踏板 -->
  <g class="crank-near">
    <line x1="320" y1="296" x2="345" y2="330" stroke="#4b5865" stroke-width="7"/>
    <path d="M 285 179 C 306 197 318 218 325 239"
          stroke="#f2a45c" stroke-width="19" fill="none"/>
    <path d="M 327 234 C 334 266 340 293 344 315"
          stroke="#f2a45c" stroke-width="14" fill="none"/>
    <rect x="333" y="325" width="26" height="11" rx="5.5" fill="#3d4a56"
          transform="rotate(12 346 330)"/>
    <path d="M 334 312 Q 352 307 366 321 Q 354 331 340 328 Q 332 325 334 312 Z"
          fill="#f2a45c" stroke="#dd9247" stroke-width="1.5"/>
  </g>

  <!-- 鹈鹕：脖子 -->
  <path d="M 350 130 C 358 102 376 86 400 82" stroke="#cbd9e3" stroke-width="34" fill="none"/>
  <path d="M 350 130 C 358 102 376 86 400 82" stroke="#ffffff" stroke-width="29" fill="none"/>

  <!-- 鹈鹕：身体 -->
  <ellipse cx="310" cy="145" rx="58" ry="40" transform="rotate(-30 310 145)"
           fill="#ffffff" stroke="#cbd9e3" stroke-width="2.5"/>
  <ellipse cx="322" cy="167" rx="36" ry="17" transform="rotate(-22 322 167)"
           fill="#e7eff6" clip-path="url(#bodyClip)"/>

  <!-- 鹈鹕：头 -->
  <ellipse cx="406" cy="84" rx="33" ry="29" transform="rotate(-8 406 84)"
           fill="#ffffff" stroke="#cbd9e3" stroke-width="2.5"/>
  <path d="M 392 59 C 388 49 394 42 403 44 C 398 50 398 55 400 60 Z"
        fill="#ffffff" stroke="#cbd9e3" stroke-width="2.5"/>

  <!-- 鹈鹕：喉囊与长喙 -->
  <path d="M 428 84 C 432 108 452 126 476 122 C 498 118 510 104 512 90
           C 492 96 458 92 428 84 Z" fill="#f8c46b" stroke="#e0a748" stroke-width="2"/>
  <path d="M 430 70 C 460 70 490 78 512 90 C 490 87 458 85 430 84 Z"
        fill="#f0932f" stroke="#d47f22" stroke-width="2"/>

  <!-- 鹈鹕：眼睛 -->
  <circle cx="398" cy="72" r="4.8" fill="#2f3a45"/>
  <circle cx="396.4" cy="69.6" r="1.7" fill="#ffffff"/>

  <!-- 鹈鹕：翅膀抓握车把 -->
  <path d="M 344 112 C 368 118 386 134 396 150" stroke="#cbd9e3" stroke-width="31" fill="none"/>
  <path d="M 344 112 C 368 118 386 134 396 150" stroke="#ffffff" stroke-width="26" fill="none"/>
  <path d="M 350 126 C 364 134 376 146 384 158" stroke="#e7eff6" stroke-width="2" fill="none"/>
</svg>
